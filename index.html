<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0a0f16">
    <title>Queue 001</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      .board {
        display: grid;
        place-items: center;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        padding: max(12px, env(safe-area-inset-top))
          max(12px, env(safe-area-inset-right))
          max(12px, env(safe-area-inset-bottom))
          max(12px, env(safe-area-inset-left));
        background: radial-gradient(circle at center, #1c2633, #0a0f16 70%);
        cursor: pointer;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
      }

      .board:focus-visible {
        outline: 3px solid #ffcb55;
        outline-offset: -6px;
      }

      .number {
        color: #ffcb55;
        font-size: min(42vw, 70dvh);
        font-weight: 800;
        font-variant-numeric: tabular-nums lining-nums;
        letter-spacing: 0.04em;
        line-height: 1;
        white-space: nowrap;
        text-shadow: 0 0 0.08em #ffae2b, 0 0 0.35em #b85a00;
      }

      .is-blinking .number {
        animation: blink 1s infinite;
      }

      @keyframes blink {
        0%, 49.99% {
          opacity: 1;
        }

        50%, 99.99% {
          opacity: 0.06;
        }
      }
    </style>
  </head>
  <body>
    <main id="board" class="board" role="button" tabindex="0" aria-label="Ticket 001. Activate to start blinking">
      <span class="number" aria-hidden="true">001</span>
    </main>

    <script>
      const board = document.getElementById("board");
      let stopsAt;
      let timer;
      let blinkCycle = 0;

      function startBlinking() {
        if (board.classList.contains("is-blinking")) return;
        board.classList.add("is-blinking");
        board.setAttribute("aria-label", "Ticket 001. Activate to stop blinking");
        stopsAt = Date.now() + 15_000;
        const cycle = ++blinkCycle;
        timer = window.setTimeout(() => {
          if (blinkCycle === cycle) stopBlinking();
        }, 15_000);
      }

      function stopBlinking() {
        if (!board.classList.contains("is-blinking")) return;
        board.classList.remove("is-blinking");
        board.setAttribute("aria-label", "Ticket 001. Activate to start blinking");
        blinkCycle++;
        window.clearTimeout(timer);
        timer = undefined;
        stopsAt = undefined;
      }

      function toggleBlinking() {
        if (board.classList.contains("is-blinking")) stopBlinking();
        else startBlinking();
      }

      startBlinking();
      board.addEventListener("pointerdown", toggleBlinking);
      board.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          toggleBlinking();
        }
      });

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && stopsAt !== undefined && Date.now() >= stopsAt) stopBlinking();
      });
    </script>
  </body>
</html>
